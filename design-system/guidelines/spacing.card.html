<!-- @dsCard group="Spacing" viewport="700x150" name="The 4px ladder" subtitle="2 · 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The 4px ladder</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div style="display:flex;gap:12;align-items:flex-end"><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:2px;height:2px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">2</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:4px;height:4px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">4</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:8px;height:8px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">8</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:12px;height:12px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">12</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:16px;height:16px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">16</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:24px;height:24px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">24</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:32px;height:32px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">32</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-7</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:48px;height:48px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">48</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6"><div style="width:64px;height:64px;background:var(--exit-500);opacity:.75;border-radius:1px"></div><span style="font:400 11px/1 var(--font-body);color:var(--fg-3)">64</span><span style="font:400 10px/1 var(--font-body);color:var(--fg-4)">sp-9</span></div>
<p style="font:400 var(--fs-micro)/1.5 var(--font-body);color:var(--fg-3);margin:0 0 4px 18px;max-width:300px">Panels pad at 24, rows at 12, clusters gap at 8. Every HUD cluster sits 48 from the screen edge.</p></div>

</body></html>
