<!-- @dsCard group="Colors" viewport="700x160" name="Sleeper identity" subtitle="The four colour-blind-safe values — never without a number and a name" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sleeper identity</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div style="display:flex;gap:12"><div style="flex:1;display:flex;align-items:center;gap:10;padding:10px;border:var(--bw-hair) solid var(--line);border-radius:var(--r-2)">
<span style="width:32px;height:32px;flex:0 0 auto;border-radius:var(--r-full);border:2px solid var(--sleeper-1);background:var(--sleeper-1);font:600 var(--fs-heading)/28px var(--font-body);text-align:center;color:#07110b">1</span>
<span><span style="display:block;font:400 var(--fs-body)/1.2 var(--font-body);color:var(--fg-1)">Anna</span><span style="font:400 12px/1.3 var(--font-body);color:var(--fg-3)">#e69f00</span></span></div><div style="flex:1;display:flex;align-items:center;gap:10;padding:10px;border:var(--bw-hair) solid var(--line);border-radius:var(--r-2)">
<span style="width:32px;height:32px;flex:0 0 auto;border-radius:var(--r-full);border:2px solid var(--sleeper-2);background:var(--sleeper-2);font:600 var(--fs-heading)/28px var(--font-body);text-align:center;color:#07110b">2</span>
<span><span style="display:block;font:400 var(--fs-body)/1.2 var(--font-body);color:var(--fg-1)">Ben</span><span style="font:400 12px/1.3 var(--font-body);color:var(--fg-3)">#56b4e9</span></span></div><div style="flex:1;display:flex;align-items:center;gap:10;padding:10px;border:var(--bw-hair) solid var(--line);border-radius:var(--r-2)">
<span style="width:32px;height:32px;flex:0 0 auto;border-radius:var(--r-full);border:2px solid var(--sleeper-3);background:var(--sleeper-3);font:600 var(--fs-heading)/28px var(--font-body);text-align:center;color:#07110b">3</span>
<span><span style="display:block;font:400 var(--fs-body)/1.2 var(--font-body);color:var(--fg-1)">Cara</span><span style="font:400 12px/1.3 var(--font-body);color:var(--fg-3)">#009e73</span></span></div><div style="flex:1;display:flex;align-items:center;gap:10;padding:10px;border:var(--bw-hair) solid var(--line);border-radius:var(--r-2)">
<span style="width:32px;height:32px;flex:0 0 auto;border-radius:var(--r-full);border:2px solid var(--sleeper-4);background:var(--sleeper-4);font:600 var(--fs-heading)/28px var(--font-body);text-align:center;color:#07110b">4</span>
<span><span style="display:block;font:400 var(--fs-body)/1.2 var(--font-body);color:var(--fg-1)">Dev</span><span style="font:400 12px/1.3 var(--font-body);color:var(--fg-3)">#cc79a7</span></span></div></div>
<p style="font:400 var(--fs-micro)/1.5 var(--font-body);color:var(--fg-3);margin:14px 0 0">Filled with the raw colour, never darkened toward the numeral. None of the four clears 4.5:1 as text on mist, so a Sleeper's colour is only ever a chip, a marker or a stroke; the name is always <code style="color:var(--fg-2)">--fg-1</code>.</p>

</body></html>
