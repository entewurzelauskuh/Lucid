<!-- @dsCard group="Colors" viewport="700x170" name="Text on mist" subtitle="Contrast against a panel over a dark view. --fg-4 is decorative only." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Text on mist</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div style="display:flex;gap:14">
<div style="flex:1"><div style="font:400 var(--fs-heading)/1.3 var(--font-body);color:var(--fg-1)">Everyone woke up</div><div style="font:400 12px/1.4 var(--font-body);color:var(--fg-3);margin-top:4px">--fg-1 · 13.4:1 · AAA</div></div>
<div style="flex:1"><div style="font:400 var(--fs-heading)/1.3 var(--font-body);color:var(--fg-2)">Woke at 3:12</div><div style="font:400 12px/1.4 var(--font-body);color:var(--fg-3);margin-top:4px">--fg-2 · 9.0:1 · AAA</div></div>
<div style="flex:1"><div style="font:400 var(--fs-heading)/1.3 var(--font-body);color:var(--fg-3)">depth 7 · exit 11</div><div style="font:400 12px/1.4 var(--font-body);color:var(--fg-3);margin-top:4px">--fg-3 · 5.3:1 · AA</div></div>
<div style="flex:1"><div style="font:400 var(--fs-heading)/1.3 var(--font-body);color:var(--fg-4)">24px and up only</div><div style="font:400 12px/1.4 var(--font-body);color:var(--fg-3);margin-top:4px">--fg-4 · 3.1:1 · AA large</div></div></div>

</body></html>
