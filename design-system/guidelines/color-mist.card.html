<link rel="stylesheet" href="../styles.css">

<body><div style="display:flex;gap:10"><div style="flex:1;min-width:0"><div style="height:52px;border-radius:var(--r-2);background:var(--ink-900);border:var(--bw-hair) solid var(--line-faint)"></div><div style="margin-top:6px;font:400 var(--fs-micro)/1.4 var(--font-body);color:var(--fg-2)">--ink-900</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">#070b12 void</div></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:var(--r-2);background:var(--ink-800);border:var(--bw-hair) solid var(--line-faint)"></div><div style="margin-top:6px;font:400 var(--fs-micro)/1.4 var(--font-body);color:var(--fg-2)">--ink-800</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">#0d1420 sunken</div></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:var(--r-2);background:var(--ink-700);border:var(--bw-hair) solid var(--line-faint)"></div><div style="margin-top:6px;font:400 var(--fs-micro)/1.4 var(--font-body);color:var(--fg-2)">--ink-700</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">#131c2e raised</div></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:var(--r-2);background:var(--mist-600);border:var(--bw-hair) solid var(--line-faint)"></div><div style="margin-top:6px;font:400 var(--fs-micro)/1.4 var(--font-body);color:var(--fg-2)">--mist-600</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">#22314a panel</div></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:var(--r-2);background:var(--mist-500);border:var(--bw-hair) solid var(--line-faint)"></div><div style="margin-top:6px;font:400 var(--fs-micro)/1.4 var(--font-body);color:var(--fg-2)">--mist-500</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">#2e4160 hover</div></div><div style="flex:1;min-width:0"><div style="height:52px;border-radius:var(--r-2);background:var(--mist-400);border:var(--bw-hair) solid var(--line-faint)"></div><div
