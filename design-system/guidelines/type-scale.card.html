<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The five sizes</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div style="display:flex;flex-direction:column;gap:8"><div style="display:flex;align-items:baseline;gap:14"><code style="width:120px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--fs-display</code><span style="width:38px;flex:0 0 auto;font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2)">64px</span><span style="font:400 var(--fs-body)/1.3 var(--font-body);color:var(--fg-3)">Outcome, LUCID, reveal</span></div><div style="display:flex;align-items:baseline;gap:14"><code style="width:120px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--fs-title</code><span style="width:38px;flex:0 0 auto;font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2)">34px</span><span style="font:400 var(--fs-body)/1.3 var(--font-body);color:var(--fg-3)">Screen title, dawn timer, budget</span></div><div style="display:flex;align-items:baseline;gap:14"><code style="width:120px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--fs-heading</code><span style="width:38px;flex:0 0 auto;font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2)">22px</span><span style="font:400 var(--fs-body)/1.3 var(--font-body);color:var(--fg-3)">Panel heading, player name, scoreboard row — the 720p floor</span></div><div style="display:flex;align-items:baseline;gap:14"><code style="width:120px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--fs-body</code><span style="width:38px;flex:0 0 auto;font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2)">16px</span><span style="font:400 var(--fs-body)/1.3 var(--font-body);color:var(--fg-3)">Every ordinary string</span></div><div style="display:flex;align-items:baseline;gap:14"><code style="width:120px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--fs-micro</code><span style="width:38px;flex:0 0 auto;font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2)">13px</span><span style="font:400 var(--fs-body)/1.3 var(--font-body);color:var(--fg-3)">Hotkey, cost, build. Never carries a rule.</span></div></div>

</body></html>
