<!-- @dsCard group="Brand" viewport="700x230" name="Icon grid — 24px, 1.5 stroke" subtitle="Powers, categories, ready state. Thin line, currentColor, no fills." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Icon grid — 24px, 1.5 stroke</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">const { Icon } = window.DesignSystem_427bea;
const G=[['Powers & effects',['power-dark','power-fog','power-molasses','power-trigger','power-possess','power-target']],['Pack categories',['cat-connector','cat-vertical','cat-chicane','cat-mob','cat-gimmick']],['State',['ready','unready','role-nightmare','role-sleeper','moon','crown','weak-point','depth']]];
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'flex',flexDirection:'column',gap:14}}>{G.map(([t,names])=>
    <div key={t}><p className="lbl">{t}</p>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>{names.map(n=>
        <div key={n} style={{width:76,display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'8px 4px',border:'var(--bw-hair) solid var(--line-faint)',borderRadius:'var(--r-1)'}}>
          <Icon name={n} size={26} color="var(--fg-1)"/>
          <span style={{font:'400 10px/1.2 var(--font-body)',color:'var(--fg-4)',textAlign:'center'}}>{n.replace(/^(power|cat)-/,'')}</span>
        </div>)}</div></div>)}</div>);</script>
</body></html>
