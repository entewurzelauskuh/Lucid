<!-- @dsCard group="Spacing" viewport="700x150" name="Motion durations" subtitle="Five durations, two easings. Nothing a rule depends on ever animates." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion durations</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div style="display:flex;flex-direction:column;gap:7"><div style="display:flex;align-items:center;gap:12"><code style="width:118px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--dur-instant</code><span style="display:block;width:23px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--exit-500),var(--fog-500))"></span><span style="font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2);width:46px">90ms</span><span style="font:400 var(--fs-micro)/1.3 var(--font-body);color:var(--fg-3)">press, chip select, rejection label</span></div><div style="display:flex;align-items:center;gap:12"><code style="width:118px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--dur-fast</code><span style="display:block;width:35px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--exit-500),var(--fog-500))"></span><span style="font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2);width:46px">140ms</span><span style="font:400 var(--fs-micro)/1.3 var(--font-body);color:var(--fg-3)">hover, focus</span></div><div style="display:flex;align-items:center;gap:12"><code style="width:118px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--dur-base</code><span style="display:block;width:55px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--exit-500),var(--fog-500))"></span><span style="font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2);width:46px">220ms</span><span style="font:400 var(--fs-micro)/1.3 var(--font-body);color:var(--fg-3)">panel and toast in/out, ghost colour</span></div><div style="display:flex;align-items:center;gap:12"><code style="width:118px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--dur-slow</code><span style="display:block;width:100px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--exit-500),var(--fog-500))"></span><span style="font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2);width:46px">400ms</span><span style="font:400 var(--fs-micro)/1.3 var(--font-body);color:var(--fg-3)">screen fade, layer cut-away</span></div><div style="display:flex;align-items:center;gap:12"><code style="width:118px;flex:0 0 auto;font:500 var(--fs-micro)/1 var(--font-body);color:var(--exit-500)">--dur-veil</code><span style="display:block;width:225px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--exit-500),var(--fog-500))"></span><span style="font:400 var(--fs-micro)/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg-2);width:46px">900ms</span><span style="font:400 var(--fs-micro)/1.3 var(--font-body);color:var(--fg-3)">white-out on waking, sink to black</span></div></div>

</body></html>
