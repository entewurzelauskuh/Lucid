<!-- @dsCard group="Spacing" viewport="700x160" name="Radii, hairlines and rings" subtitle="The UI is crisp: 2–6px corners, 1px edges, rings are the only circles" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radii, hairlines and rings</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div style="display:flex;gap:14;align-items:center"><div style="flex:1;text-align:center"><div style="height:56px;border-radius:2px;border:var(--bw-hair) solid var(--line-strong);background:color-mix(in srgb,var(--mist-600) 72%,transparent)"></div><div style="margin-top:8px;font:500 var(--fs-micro)/1.4 var(--font-body);color:var(--exit-500)">--r-1</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">2px · chip</div></div><div style="flex:1;text-align:center"><div style="height:56px;border-radius:3px;border:var(--bw-hair) solid var(--line-strong);background:color-mix(in srgb,var(--mist-600) 72%,transparent)"></div><div style="margin-top:8px;font:500 var(--fs-micro)/1.4 var(--font-body);color:var(--exit-500)">--r-2</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">3px · panel</div></div><div style="flex:1;text-align:center"><div style="height:56px;border-radius:6px;border:var(--bw-hair) solid var(--line-strong);background:color-mix(in srgb,var(--mist-600) 72%,transparent)"></div><div style="margin-top:8px;font:500 var(--fs-micro)/1.4 var(--font-body);color:var(--exit-500)">--r-3</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">6px · cube card</div></div><div style="flex:1;text-align:center"><div style="height:56px;border-radius:999px;border:var(--bw-hair) solid var(--line-strong);background:color-mix(in srgb,var(--mist-600) 72%,transparent)"></div><div style="margin-top:8px;font:500 var(--fs-micro)/1.4 var(--font-body);color:var(--exit-500)">--r-full</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">999px · ring</div></div>
<div style="flex:1;text-align:center"><div style="height:56px;display:flex;align-items:center;justify-content:center;gap:8"><span style="display:block;width:22px;height:0;border-top:1px solid var(--line-strong)"></span><span style="display:block;width:22px;height:0;border-top:2px solid var(--exit-500)"></span><span style="display:block;width:22px;height:0;border-top:3px solid var(--fog-300)"></span></div><div style="margin-top:8px;font:500 var(--fs-micro)/1.4 var(--font-body);color:var(--exit-500)">--bw-*</div><div style="font:400 11px/1.3 var(--font-body);color:var(--fg-4)">hair 1 · focus 2 · ring 3</div></div></div>

</body></html>
