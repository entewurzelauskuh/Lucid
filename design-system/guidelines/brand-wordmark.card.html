<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="No logo exists in the repo — the name is set in type until one does" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div style="display:flex;align-items:center;gap:36">
<div><div style="font:300 var(--fs-display)/1 var(--font-display);letter-spacing:0.22em;color:var(--fg-1);text-shadow:0 0 40px rgba(195,212,234,.28)">LUCID</div>
<div style="font:400 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-4);margin-top:12px;padding-left:4px">Cormorant Garamond 300 · tracking 0.22em</div></div>
<p style="font:400 var(--fs-micro)/1.6 var(--font-body);color:var(--fg-3);margin:0;max-width:250px">On the Title screen it sits over the bedroom's fog door with a soft outer glow and nothing else. Never a mark, never an icon lockup, never coloured.</p></div>

</body></html>
