<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lobby — player rows and scoreboard rows</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;height:100%}body{background:radial-gradient(120% 120% at 22% 12%,#233149 0%,#0d1420 55%,#070b12 100%);font-family:var(--font-body);color:var(--text-body);padding:24px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font:500 var(--fs-micro)/1 var(--font-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}a{color:var(--exit-500)}a:hover{color:var(--exit-300)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">const { PlayerRow, ScoreboardRow, MistPanel } = window.DesignSystem_427bea;
function Demo(){
  const [role,setRole]=React.useState('nightmare'); const [ready,setReady]=React.useState(true);
  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div>
      <PlayerRow name="Anna" host role={role} ready={ready} self onRole={setRole} onReady={setReady}/>
      <PlayerRow name="Ben" role="sleeper"/>
    </div>
    <MistPanel pad={12}>
      <ScoreboardRow header rank="#" name="Player" rounds="As Nightmare" woke="Woke" consumed="Consumed" score="Score"/>
      <ScoreboardRow rank={1} index={2} name="Anna" rounds={2} woke={3} consumed={1} score={612} delta={148}/>
      <ScoreboardRow rank={2} index={1} name="Ben" rounds={1} woke={2} consumed={2} score={430}/>
      <ScoreboardRow rank={3} index={3} name="Cara" rounds={0} woke={1} consumed={3} score={205} highlight/>
    </MistPanel>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);</script>
</body></html>
